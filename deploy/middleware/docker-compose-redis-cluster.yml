services:
  redis-node-1:
    image: ${IMAGE_REDIS:-ghcr.io/beyonai/byclaw/byclaw-redis:main}
    container_name: byclaw-redis-node-1-${CONTAINER_SUFFIX:-middleware}
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD} --cluster-announce-ip ${HOST} --cluster-announce-port ${REDIS_CLUSTER_PORT_1:-6371} --cluster-announce-bus-port ${REDIS_CLUSTER_BUS_PORT_1:-16371}
    ports:
      - "${REDIS_CLUSTER_PORT_1:-6371}:6379"
      - "${REDIS_CLUSTER_BUS_PORT_1:-16371}:16379"
    networks:
      - byclaw-network
    restart: unless-stopped

  redis-node-2:
