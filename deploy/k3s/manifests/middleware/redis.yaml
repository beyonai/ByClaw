apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: by-middleware
type: Opaque
stringData:
  password: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: by-middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: ghcr.io/beyonai/byclaw/byclaw-redis:main
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: by-middleware
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
