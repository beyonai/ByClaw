apiVersion: v1
kind: Secret
metadata:
  name: opengauss-auth
  namespace: by-middleware
type: Opaque
stringData:
  password: change-me
  username: gaussdb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opengauss-data
  namespace: by-middleware
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opengauss
  namespace: by-middleware
spec:
  serviceName: opengauss
  replicas: 1
  selector:
    matchLabels:
      app: opengauss
  template:
    metadata:
      labels:
        app: opengauss
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: opengauss
          image: ghcr.io/beyonai/byclaw/byclaw-opengauss:main
          ports:
            - containerPort: 5432
          env:
            - name: GS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opengauss-auth
                  key: password
            - name: GS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opengauss-auth
                  key: username
            - name: GS_PORT
              value: "5432"
            - name: GS_DB
              value: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/opengauss
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opengauss-data
---
apiVersion: v1
kind: Service
metadata:
  name: opengauss
  namespace: by-middleware
spec:
  selector:
    app: opengauss
  ports:
    - port: 5432
      targetPort: 5432
