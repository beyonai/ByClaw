apiVersion: v1
kind: ConfigMap
metadata:
  name: byclaw-fe-nginx
  namespace: by-service
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byclaw-fe
  namespace: by-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byclaw-fe
  template:
    metadata:
      labels:
        app: byclaw-fe
      annotations:
        byclaw.io/nginx-config-sha256: static
    spec:
      containers:
        - name: fe
          image: ghcr.io/beyonai/byclaw/byclaw-fe:main
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: byclaw-fe-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: byclaw-fe
  namespace: by-service
spec:
  selector:
    app: byclaw-fe
  ports:
    - name: http
      port: 80
      targetPort: http
