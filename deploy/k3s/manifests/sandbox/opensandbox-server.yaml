apiVersion: v1
kind: Secret
metadata:
  name: opensandbox-api
  namespace: by-sandbox
type: Opaque
stringData:
  api-key: change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-server-config
  namespace: by-sandbox
data:
  # 由 deploy.sh update 时从 gen-opensandbox-k8s-config.sh 生成内容覆盖
  opensandbox-server-k8s.toml: |
    [runtime]
    type = "kubernetes"
  config.toml: |
    [runtime]
    type = "kubernetes"
  batchsandbox-template.yaml: |
    apiVersion: sandbox.opensandbox.io/v1alpha1
    kind: BatchSandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-server
  namespace: by-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opensandbox-server
  template:
    metadata:
      labels:
        app: opensandbox-server
    spec:
      serviceAccountName: opensandbox-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: opensandbox-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/server:v0.1.14
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_CONFIG_PATH
              value: /etc/opensandbox/opensandbox-server-k8s.toml
            - name: OPENSANDBOX_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opensandbox-api
                  key: api-key
          ports:
            - name: http
              containerPort: 9005
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox
      volumes:
        - name: config
          configMap:
            name: opensandbox-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-server
  namespace: by-sandbox
spec:
  selector:
    app: opensandbox-server
  ports:
    - name: http
      port: 9005
      targetPort: http
