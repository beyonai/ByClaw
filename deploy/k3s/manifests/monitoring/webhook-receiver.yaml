# 简易 Alertmanager webhook 接收器（可替换为钉钉/企业微信 adapter）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-webhook
  namespace: by-middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-webhook
  template:
    metadata:
      labels:
        app: alertmanager-webhook
    spec:
      containers:
        - name: webhook
          image: ghcr.io/beyonai/byclaw/byclaw-be:main
          command: ["sh", "-c", "echo 'Webhook receiver placeholder - replace with dingtalk/wecom adapter' && sleep infinity"]
          ports:
            - containerPort: 9099
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-webhook
  namespace: by-middleware
spec:
  selector:
    app: alertmanager-webhook
  ports:
    - port: 9099
      targetPort: 9099
