apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: byclaw-sandbox-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: byclaw.sandbox
      rules:
        - alert: SandboxPodPending
          expr: kube_pod_status_phase{namespace="by-sandbox", phase="Pending"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "沙箱 Pod 长时间 Pending"
            description: "namespace=by-sandbox 存在 Pending Pod，可能资源不足或 PVC 挂载失败"
        - alert: SandboxPodOOMKilled
          expr: increase(kube_pod_container_status_last_terminated_reason{namespace="by-sandbox", reason="OOMKilled"}[1h]) > 0
          labels:
            severity: critical
            targetProfileKey: s
            resizeType: IN_PLACE
          annotations:
            summary: "沙箱容器 OOMKilled"
            reasonCode: "sandbox.oom_killed"
        - alert: OpenSandboxHighLatency
          expr: histogram_quantile(0.95, rate(opensandbox_sandbox_create_duration_seconds_bucket[5m])) > 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "沙箱创建 P95 延迟过高"
    - name: byclaw.mobile.push
      rules:
        - alert: HacuMobilePushFailures
          expr: sum(increase(hacu_mobile_push_attempts_total{outcome=~"vendor_failed|error|rejected"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "手机消息通知异常 / Mobile push failures"
            description: "推送存在厂商拒绝、内部异常或队列满载，请检查固定 outcome 指标；不要记录凭证或完整请求。"
        - alert: HacuMobilePushThrottledOrExpired
          expr: sum(increase(hacu_mobile_push_attempts_total{outcome=~"rate_limited|expired"}[10m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "手机通知积压或限流 / Mobile push throttled or expired"
            description: "检查单发额度、Redis 和执行器延迟；不要对结果未知的请求自动补发。"
