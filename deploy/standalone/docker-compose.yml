services:
  fe:
    image: ${IMAGE_FE:-ghcr.io/beyonai/byclaw/byclaw-fe:main}
    container_name: byclaw-fe-${CONTAINER_SUFFIX:-standalone}
    ports:
      - "${NGINX_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config/nginx-standalone.conf:/etc/nginx/conf.d/default.conf
      - ../config/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - byclaw-network
    depends_on:
      - be
    restart: unless-stopped

  be:
    image: ${IMAGE_BE:-ghcr.io/beyonai/byclaw/byclaw-be:main}
    #image: byclaw-be:local
    container_name: byclaw-be-${CONTAINER_SUFFIX:-standalone}
    user: "1001:1001"
    ports:
      - "${BE_SERVER_PORT:-8086}:${BE_SERVER_PORT:-8086}"
      - "${BE_WS_PORT:-8082}:${BE_WS_PORT:-8082}"
    env_file:
      - ../../.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:TieredStopAtLevel=1 -XX:+UseParallelGC -Dspring.jmx.enabled=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config:/app/config
      - ./logs/be:/app/logs
      # dws 登录态（file-DEK 加密），持久化后重启无需重新钉钉授权。
      - byclaw-dws-auth:/home/appuser/.dws
      - ${BYCLAW_SANDBOX_FILE_VOLUME_ROOT:-/mnt/byclaw-file}:${BYCLAW_SANDBOX_FILE_VOLUME_ROOT:-/mnt/byclaw-file}
    networks:
      - byclaw-network
    restart: unless-stopped

  super:
    image: ${IMAGE_SUPER:-ghcr.io/beyonai/byclaw/byclaw-super:main}
    container_name: byclaw-super-${CONTAINER_SUFFIX:-standalone}
    user: "1000:1000"
    ports:
      - "${BYCLAW_SUPER_PORT:-3000}:3000"
    env_file:
      - ../../.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DB_SSL=${BYCLAW_SUPER_DB_SSL:-false}
      - DB_EVENT_LISTEN_ENABLED=${BYCLAW_SUPER_DB_EVENT_LISTEN_ENABLED:-false}
      - DB_MIGRATE_ON_START=false
      - BYCLAW_BE_BASE_URL=${BYCLAW_SUPER_BE_BASE_URL:-http://be:8086}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - byclaw-network
    depends_on:
      - be
    restart: unless-stopped

  qa-manager:
    image: ${IMAGE_QA:-ghcr.io/beyonai/byclaw/byclaw-qa:main}
    container_name: byclaw-qa-manager-${CONTAINER_SUFFIX:-standalone}
    user: "1001:1001"
    command: api
    ports:
      - "${BYCLAW_QA_PORT:-8000}:${BYCLAW_QA_PORT:-8000}"
    env_file:
      - ../../.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config:/app/config
      - ./logs/qa:/app/logs
    networks:
      - byclaw-network
    restart: unless-stopped

  qa-worker:
    image: ${IMAGE_QA:-ghcr.io/beyonai/byclaw/byclaw-qa:main}
    container_name: byclaw-qa-worker-${CONTAINER_SUFFIX:-standalone}
    user: "1001:1001"
    command: worker
    env_file:
      - ../../.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config:/app/config
      - ./logs/qa:/app/logs
    networks:
      - byclaw-network
    restart: unless-stopped

  data:
    image: ${IMAGE_DATA:-ghcr.io/beyonai/byclaw/byclaw-data:main}
    container_name: byclaw-data-${CONTAINER_SUFFIX:-standalone}
    user: "1001:1001"
    ports:
      - "${DATACLOUD_PORT:-8087}:${DATACLOUD_PORT:-8087}"
    env_file:
      - ../../.env
    environment:
      - JAVA_OPTS=-Xms256m -Xmx1g -XX:TieredStopAtLevel=1 -XX:+UseParallelGC -Dspring.jmx.enabled=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config:/app/config
      - ./logs/data:/app/logs
      - ${FILE_STORAGE_MINIO_MOUNT_PATH:-/data/byclaw}:${FILE_STORAGE_MINIO_MOUNT_PATH:-/data/byclaw}
    networks:
      - byclaw-network
    restart: unless-stopped

  demo:
    image: ${IMAGE_DEMO:-ghcr.io/beyonai/byclaw-middleware/byclaw-demo:main}
    container_name: byclaw-demo-${CONTAINER_SUFFIX:-standalone}
    profiles:
      - demo
    user: "1001:1001"
    ports:
      - "${APIDEMO_PORT:-8999}:${APIDEMO_PORT:-8999}"
    env_file:
      - ../../.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../config/logback.xml:/app/config/logback.xml:ro
      - ./logs/demo:/app/logs
    networks:
      - byclaw-network
    restart: unless-stopped

networks:
  byclaw-network:
    name: byclaw-network-${CONTAINER_SUFFIX:-default}
    driver: bridge

volumes:
  # dws 钉钉登录态持久卷（file-DEK 加密），跨容器重启保留授权
  byclaw-dws-auth:
    name: byclaw-dws-auth-${CONTAINER_SUFFIX:-standalone}
