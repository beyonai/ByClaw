<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByClaw Browser Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="hero">
        <div class="eyebrow">ByClaw</div>
        <h1>Browser Bridge</h1>
        <p>连接你已登录的浏览器页面，执行 ByClaw 对话下发的采集任务。</p>
      </section>
      <section class="status" id="status">正在读取绑定状态...</section>
      <section class="status bridge" id="bridgeStatus">桥接通道：正在读取状态...</section>
      <button id="bridgeBtn" class="primary" type="button">重新连接桥接通道</button>
      <button id="refreshBtn" class="secondary" type="button">刷新绑定状态</button>
      <button id="unbindBtn" class="danger" type="button">解绑当前配置</button>
      <pre id="result" class="result"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
