[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byclaw-groksearchcli"
version = "0.1.0"
description = "Grok Web and X search client for ByClaw skills"
requires-python = ">=3.11"
dependencies = ["xai-sdk==1.19"]

[project.scripts]
groksearchcli = "groksearchcli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
