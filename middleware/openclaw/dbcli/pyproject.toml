[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byclaw-dbcli"
version = "0.1.0"
description = "Session-scoped SQL execution runtime for ByClaw skills"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
mysql = ["PyMySQL>=1.1,<2"]
oracle = ["oracledb>=2,<4"]
all = ["psycopg[binary]>=3.1,<4", "PyMySQL>=1.1,<2", "oracledb>=2,<4"]

[project.scripts]
dbcli = "dbcli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
