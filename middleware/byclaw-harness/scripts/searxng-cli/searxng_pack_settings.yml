# SearXNG CLI 覆盖配置 —— 通过 SEARXNG_SETTINGS_PATH 注入
# 仅覆盖需要变更的键，其余继承仓库内默认 searx/settings.yml（use_default_settings 合并）
use_default_settings: true

outgoing:
  # 引擎默认请求超时（默认 3s 过紧，放宽到 10s）
  request_timeout: 10.0
  # 单次搜索的全局超时上限
  max_request_timeout: 20.0
  # 不内置代理：默认直连上游引擎；如需代理，在 SKILL.md 说明如何配置

valkey:
  # 禁用外部 valkey/redis（CLI 单次进程无需共享缓存，内存模式即可）
  url: false
