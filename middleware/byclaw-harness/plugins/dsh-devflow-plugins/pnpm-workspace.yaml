packages:
  - packages/*

# The harness packages these plugins compose against are consumed from npm at
# one exact prerelease version, never a range: `^0.1.1-rc.2` would not match a
# later prerelease, and a floating range across a harness that has not reached
# 1.0 is how a plugin line silently stops loading.
linkWorkspacePackages: true

# pnpm blocks install scripts until reviewed. These arrive through the harness
# packages the gates plugin composes against; the plugin line runs none of them.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true
  # Midscene's screenshot/image processing requires sharp's platform binary.
  sharp: true
  # Denied on purpose: their `install: node-gyp-build` would fetch native
  # prebuilds the anchor evaluators never load — only the wasm in each tarball
  # is used. Flipping these to true buys nothing and starts running scripts.
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-python: false
  tree-sitter-rust: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.5-rc.2'
  - '@deepseek-ai/dsh-agent-presets@0.1.5-rc.2'
