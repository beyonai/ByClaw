# Off by default: the shared DSH host enables both rows for the users in
# BYCLAW_SESSION_DB_USERS, disabling session-persistence-jsonl and routing
# storage-domain to backend `db`. A per-user sandbox must keep files because
# model-generated commands run beside the harness there and could read the
# database credentials.
- insert:
    - id: session-persistence-db
      name: '@byclaw/dsh-db/session'
      disabled: true

    - id: storage-db
      name: '@byclaw/dsh-db/storage'
      disabled: true
