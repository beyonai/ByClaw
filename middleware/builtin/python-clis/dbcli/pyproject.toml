[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byclaw-dbcli"
version = "0.1.0"
description = "Session-scoped SQL execution runtime for ByClaw skills"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.5"]
mysql = ["PyMySQL==1.2.0"]
oracle = ["oracledb==3.4.2"]
all = ["psycopg[binary]==3.3.5", "PyMySQL==1.2.0", "oracledb==3.4.2"]

[project.scripts]
dbcli = "dbcli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
