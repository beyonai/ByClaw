[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byclaw-kbcli"
version = "0.1.0"
description = "Service-discovered knowledge-base client for ByClaw skills"
requires-python = ">=3.11"

[project.scripts]
kbcli = "kbcli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
