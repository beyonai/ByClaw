[project]
name = "byclaw-kgw"
version = "0.1.0"
description = "BeyondAI Knowledge Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "aioboto3>=13.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "by-framework>=0.1.13",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.4",
    "pylint>=3.3.1",
    "pyink==25.12.0",
    "isort>=5.13.2",
    "pre-commit>=4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
    "aiohttp>=3.14.0",
    "pytest-cov>=7.1.0",
    "by-qa[knowledge]>=0.1.12",
]
