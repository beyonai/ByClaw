version: 2
updates:
  - package-ecosystem: npm
    directory: /byclaw-fe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-npm:
        patterns: ["*"]
    labels:
      - dependencies
      - frontend

  - package-ecosystem: maven
    directory: /byclaw-be
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-maven:
        patterns: ["*"]
    labels:
      - dependencies
      - backend

  - package-ecosystem: pip
    directory: /byclaw-exe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-pip:
        patterns: ["*"]
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
