name: Mail migration OpenGauss

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIL_MIGRATION_TEST_REQUIRED: "1"
      MAIL_MIGRATION_TEST_SQL_RUNNER: /tmp/mail-opengauss-sql
      MAIL_MIGRATION_TEST_FILE_RUNNER: /tmp/mail-opengauss-file
      MAIL_MIGRATION_TEST_PSYCOPG_DSN: dbname=postgres user=gaussdb password=Byclaw_ci_2026 host=127.0.0.1 port=5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start pinned OpenGauss
        run: |
          docker run --detach --privileged --name mail-opengauss \
            --publish 127.0.0.1:5432:5432 \
            --env GS_USERNAME=gaussdb \
            --env GS_PASSWORD=Byclaw_ci_2026 \
            --env GS_DB=postgres \
            beyonclaw/byclaw-opengauss:6.0.3@sha256:74157e5718ee7affa6503a81a958ec8fb3558aa856316c86a685ef23c0d8d51f
          for attempt in $(seq 1 60); do
            if docker exec --user root mail-opengauss sh -lc \
              'su - omm -c "/usr/local/opengauss/bin/gsql -d postgres -Atc '\''select current_user'\''"' \
              | grep -qx omm; then
              exit 0
            fi
            sleep 2
          done
          docker logs mail-opengauss
          exit 1
      - name: Create file-based test runners
        run: |
          cat > "$MAIL_MIGRATION_TEST_SQL_RUNNER" <<'EOF'
          #!/bin/sh
          exec docker exec --user omm mail-opengauss \
            /usr/local/opengauss/bin/gsql -d postgres -X -v ON_ERROR_STOP=1 -At -F '|' -c "$1"
          EOF
          cat > "$MAIL_MIGRATION_TEST_FILE_RUNNER" <<'EOF'
          #!/bin/sh
          remote="/tmp/mail-migration-$$.sql"
          docker cp "$1" "mail-opengauss:$remote"
          docker exec --user root mail-opengauss sh -lc \
            "su - omm -c \"/usr/local/opengauss/bin/gsql -d postgres -X -v ON_ERROR_STOP=1 -At -F '|' -f '$remote'\""
          status=$?
          docker exec --user root mail-opengauss rm -f "$remote"
          exit "$status"
          EOF
          chmod +x "$MAIL_MIGRATION_TEST_SQL_RUNNER" "$MAIL_MIGRATION_TEST_FILE_RUNNER"
      - name: Run mail migration integration tests
        run: |
          python -m pip install psycopg2-binary==2.9.10
          python -m unittest middleware.openclaw.tests.test_mail_migration_postgres
      - name: Show OpenGauss logs
        if: always()
        run: docker logs mail-opengauss
