name: "ByClaw CodeQL Configuration"

# Exclude specific rules that produce false positives in this codebase.
#
# java/unsafe-deserialization: Project uses fastjson 2.0.53 (com.alibaba:fastjson 2.x compat package)
# which has autoType DISABLED by default. JSON.parseObject() only deserializes to JSONObject or
# explicitly specified target classes — no arbitrary class instantiation is possible.
#
# js/cross-window-information-leak: All postMessage calls target own iframes (contentWindow) or
# window.parent within the same application — no cross-origin risk.
#
# js/incomplete-sanitization: Flagged replacements are regex escaping or markdown char escaping,
# not security sanitization.
#
# js/incomplete-multi-character-sanitization: Flagged in dev-only scripts (check-unused-assets.js)
# for path normalization, not runtime security.
#
# js/double-escaping: unescapeHTML in Markdown/utils.ts correctly orders entity replacements.
#
# js/xss-through-dom: Flagged in file download helper (createElement('a') not inserted into DOM)
# and showdown internal parsing (output is post-processed).
#
# js/weak-cryptographic-algorithm: MD5 used for request signing (anti-tampering), not password storage.
#
# js/redos: URL validation regex in AddSourceModal runs on short user input (form field), no DoS risk.
query-filters:
  - exclude:
      id: java/unsafe-deserialization
  - exclude:
      id: js/cross-window-information-leak
  - exclude:
      id: js/incomplete-sanitization
  - exclude:
      id: js/incomplete-multi-character-sanitization
  - exclude:
      id: js/double-escaping
  - exclude:
      id: js/xss-through-dom
  - exclude:
      id: js/weak-cryptographic-algorithm
  - exclude:
      id: js/redos

paths-ignore:
  - "byclaw-fe/public/preview/**"
  - "byclaw-fe/public/html/**"
  - "byclaw-fe/scripts/**"
