[project]
name = "byclaw-data"
version = "0.1.0"
description = "byclaw-data stack: DataCloud MCP service + Gateway worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.0.0",
    "by-datacloud==0.3.1",
    "langchain-openai==1.1.11",
    "by-framework==0.2.2.dev9",
    "by-framework-trace-langfuse==0.0.3.dev3",
    "by-framework-langgraph==0.0.3.dev3",
    "by-framework-history-byclaw==0.0.3",
    "langfuse==4.7.1",
    "deepagents==0.4.7",
]

[project.scripts]
byclaw-data-worker = "byclaw_data.main:main"
byclaw-data-mcp = "byclaw_data.platform.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/byclaw_data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
explicit = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
#by-datacloud = { path = "D:\\data\\code\\baiying\\by-datacloud", editable = true }

[dependency-groups]
dev = [
    "pytest==8.2",
    "httpx==0.28.1",
    "ruff==0.8",
    "pytest-asyncio==1.3.0",
    "mypy==2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要本机已启动 datacloud_data_service（见 ByDC launch）",
]
