devloop.operationTask.prompt.default=请处理以下运营任务：\n\n## 运营任务信息\n- 运营项目：${projectName}\n- 任务类型：${taskType}\n- 任务名称：${title}\n- 任务描述：${description}\n\n## 资料采集配置\n- 采集方式：${sourceMode}\n- 采集来源：${sourceValue}\n- 入库方式：${storageMode}\n- 入库位置：${storageTarget}\n- 执行方式：${runMode}\n- 执行时间：${executionTime}\n\n## 运营执行配置\n- 内容类型：${contentType}\n- 发布渠道：${publishChannel}\n- 发布账号：${publishAccount}\n- 创作主题：${publishTopic}\n- 发布时间或计划：${publishSchedule}\n- 分析平台：${analysisPlatform}\n- 分析账号：${analysisAccount}\n- 分析范围：${analysisScope}\n- 指定作品：${analysisWorks}\n\n## 执行要求\n1. 严格依据任务描述、运营任务和执行配置开展工作。\n2. 及时同步关键执行进度、产出结果和异常情况。\n3. 涉及发布、登录或对外操作时，先核对对应连接器、账号和平台配置。\n
devloop.operationTask.prompt.collect.default=请处理以下资料采集与整理任务：\n\n## 运营任务信息\n- 运营项目：${projectName}\n- 任务名称：${title}\n- 任务描述：${description}\n\n## 资料采集配置\n- 采集方式：${sourceMode}\n- 采集来源：${sourceValue}\n- 入库方式：${storageMode}\n- 入库位置：${storageTarget}\n- 执行方式：${runMode}\n- 执行时间：${executionTime}\n\n## 执行要求\n1. 严格依据任务描述和资料采集配置开展工作。\n2. 将采集结果归档到配置的入库位置，并同步关键进度、产出结果和异常情况。\n3. 涉及登录或对外访问时，先核对对应连接器和平台配置。\n
devloop.operationTask.prompt.publish.default=请处理以下内容创作与发布任务：\n\n## 运营任务信息\n- 运营项目：${projectName}\n- 任务名称：${title}\n- 任务描述：${description}\n\n## 内容创作与发布配置\n- 内容类型：${contentType}\n- 发布渠道：${publishChannel}\n- 发布账号：${publishAccount}\n- 创作主题：${publishTopic}\n- 发布时间或计划：${publishSchedule}\n\n## 执行要求\n1. 严格依据任务描述和内容创作配置完成内容生产。\n2. 涉及发布或登录时，先核对发布账号和平台配置，再执行对外操作。\n3. 及时同步关键进度、发布结果和异常情况。\n
devloop.operationTask.prompt.analyze.default=请处理以下数据分析与优化任务：\n\n## 运营任务信息\n- 运营项目：${projectName}\n- 任务名称：${title}\n- 任务描述：${description}\n\n## 数据分析配置\n- 分析平台：${analysisPlatform}\n- 分析账号：${analysisAccount}\n- 分析范围：${analysisScope}\n- 指定作品：${analysisWorks}\n\n## 执行要求\n1. 严格依据任务描述和数据分析配置开展分析与优化。\n2. 分析范围为指定作品时，仅处理列出的作品；未指定时按账号范围处理。\n3. 及时同步关键进度、分析结论、优化建议和异常情况。\n
