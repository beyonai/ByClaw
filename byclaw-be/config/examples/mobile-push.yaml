# 新版独立 Push/TIMPush；不适用于已经停止新应用接入的 TPNS。
# 显式通过 spring.config.additional-location 加载，并由部署环境提供真实参数。
byclaw:
  mobile-push:
    enabled: ${MOBILE_PUSH_ENABLED:false}
    sdk-app-id: ${MOBILE_PUSH_SDK_APP_ID:0}
    client-app-key: ${MOBILE_PUSH_CLIENT_APP_KEY:}
    secret-key: ${MOBILE_PUSH_SERVER_SECRET_KEY:}
    administrator: ${MOBILE_PUSH_ADMINISTRATOR:administrator}
    environment-id: ${MOBILE_PUSH_ENVIRONMENT:production}
    host: console.tim.qq.com
    # 厂商分类/渠道须按控制台真实配置填写，不将示例值视为有效通道。
    android-info: {}
    apns-info:
      Sound: default
