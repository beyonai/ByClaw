<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>byclaw-super · dev chat</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a21;
        --panel-2: #1d222b;
        --border: #2a313c;
        --text: #e6e8eb;
        --muted: #8b94a1;
        --accent: #4d8cff;
        --reasoning: #9aa6b6;
        --user-bg: #243044;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      header h1 { font-size: 14px; margin: 0 14px 0 0; font-weight: 600; white-space: nowrap; }
      header label { color: var(--muted); font-size: 12px; }
      header input {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 9px;
        border-radius: 6px;
        font: inherit;
      }
      header input.url { width: 230px; }
      header input.token { width: 320px; }
      header .saved { color: var(--accent); font-size: 12px; opacity: 0; transition: opacity 0.3s; }
      header .saved.show { opacity: 1; }

      .main { flex: 1; display: flex; min-height: 0; }
      aside {
        width: 280px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      aside .new-btn {
        margin: 12px;
        padding: 9px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      aside .new-btn:hover { filter: brightness(1.08); }
      aside .list { overflow-y: auto; padding: 0 8px 12px; }
      aside .item {
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      aside .item:hover { background: var(--panel-2); }
      aside .item.active { background: var(--panel-2); color: var(--text); }
      aside .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      aside .item .del { color: var(--muted); opacity: 0; font-size: 12px; }
      aside .item:hover .del { opacity: 1; }
      aside .item .del:hover { color: var(--err); }
      aside .empty { color: var(--muted); font-size: 12px; padding: 8px 12px; }

      section.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .messages { flex: 1; overflow-y: auto; padding: 20px; }
      .msg { max-width: 820px; margin: 0 auto 18px; }
      .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .msg.user .bubble {
        background: var(--user-bg);
        padding: 10px 14px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.assistant .reasoning {
        color: var(--reasoning);
        font-size: 12.5px;
        border-left: 2px solid var(--border);
        padding: 2px 0 2px 10px;
        margin-bottom: 8px;
        white-space: pre-wrap;
      }
      .msg.assistant .reasoning:empty { display: none; }
      .msg.assistant .answer { white-space: pre-wrap; word-break: break-word; }
      .msg .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
      .msg .status.err { color: var(--err); }
      .cursor::after { content: "▋"; color: var(--accent); animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
      .composer .row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
      .composer textarea {
        flex: 1;
        resize: none;
        max-height: 160px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }
      .composer button {
        padding: 10px 18px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
      .composer button.stop { background: #3a4250; }
      .composer button.stop:hover:not(:disabled) { background: #4a5263; }
      .hint { max-width: 820px; margin: 2px auto 0; color: var(--muted); font-size: 11px; }
    </style>
  </head>
  body>
    <header>
      <h1>byclaw-super</h1>
      <label>Service
        <input class="url" id="url" placeholder="http://127.0.0.1:10001" />
      </label>
      <label>Beyond-Token
        <input class="token" id="token" type="password" placeholder="粘贴 Beyond-Token (JWT)" />
      </label>
      <span class="saved" id="saved">已保存</span>
    </header>

    <div class="main">
      <aside>
        <button class="new-btn" id="newBtn">＋ 新对话</button>
        <div class="list" id="list"></div>
      </aside>

      <section class="chat">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div class="row">
            <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="stopBtn" class="stop" disabled>停止</button>
            <button id="sendBtn">发送</button>
          </div>
          <div class="hint">同一对话复用 sessionId，每轮生成新的 runId。会话存在内存中，服务重启后 sessionId 失效。</div>
        </div>
      </section>
    </div>

    <script>
      "use strict";

      const LS_KEY = "byclaw-super-dev-chat";
      const state = {
        url: "http://127.0.0.1:3000",
        token: "",
        conversations: [], // { id, title, createdAt, messages: [{role, content, reasoning, runId, status}] }
        activeId: null,
      };

      // ---------- persistence ----------
      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
          state.url = raw.url || state.url;
          state.token = raw.token || "";
          state.conversations = Array.isArray(raw.conversations)
            ? raw.conversations.map((conversation) => ({
                ...conversation,
                // 仅迁移旧版浏览器本地状态；新 API 不再使用 conversationId。
                sessionId: conversation.sessionId || conversation.conversationId || null,
                conversationId: undefined,
              }))
            : [];
          state.activeId = raw.activeId ?? null;
        } catch {
          /* ignore */
        }
      }
      function save() {
        localStorage.setItem(
          LS_KEY,
          JSON.stringify({
            url: state.url,
            token: state.token,
            conversations: state.conversations,
            activeId: state.activeId,
          }),
        );
      }
      const $ = (id) => document.getElementById(id);
      const baseUrl = () => state.url.replace(/\/+$/, "");

      // 助手消息的终态展示文案集合；streamToCompletion 收尾时若不在此集合则归为“已完成”。
      const TERMINAL_UI_STATUSES = new Set([
        "error",
        "已完成",
        "已停止",
        "已中断",
        "已失效",
        "已取消",
        "失败",
        "恢复失败",
      ]);
      // 服务端 Run 的终态状态码（GET /v1/runs/:runId 返回）。
      const TERMINAL_RUN_API_STATUSES = ["COMPLETED", "FAILED", "CANCELLED"];

      // ---------- header wiring ----------
      function bindHeader() {
        const urlEl = $("url");
        const tokEl = $("token");
        const saved = $("saved");
        urlEl.value = state.url;
        tokEl.value = state.token;
        const persist = () => {
          state.url = urlEl.value.trim() || "http://127.0.0.1:3000";
          state.token = tokEl.value.trim();
          save();
          saved.classList.add("show");
          setTimeout(() => saved.classList.remove("show"), 1200);
        };
        urlEl.addEventListener("change", persist);
        tokEl.addEventListener("change", persist);
      }

      // ---------- sidebar ----------
      function renderSidebar() {
        const list = $("list");
        list.innerHTML = "";
        if (state.conversations.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "暂无历史";
          list.appendChild(empty);
          return;
        }
        // newest first
        [...state.conversations]
          .sort((a, b) => b.createdAt - a.createdAt)
          .forEach((c) => {
            const item = document.createElement("div");
            item.className = "item" + (c.id === state.activeId ? " active" : "");
            const t = document.createElement("span");
            t.className = "t";
            t.textContent = c.title || "(空对话)";
            const del = document.createElement("span");
            del.className = "del";
            del.textContent = "✕";
            del.title = "删除";
            del.addEventListener("click", (e) => {
              e.stopPropagation();
              state.conversations = state.conversations.filter((x) => x.id !== c.id);
              if (state.activeId === c.id) state.activeId = null;
              save();
              renderSidebar();
              renderMessages();
            });
            item.appendChild(t);
            item.appendChild(del);
            item.addEventListener("click", () => {
              state.activeId = c.id;
              save();
              renderSidebar();
              renderMessages();
            });
            list.appendChild(item);
          });
      }

      function activeConv() {
        return state.conversations.find((c) => c.id === state.activeId) || null;
      }

      function newConversation() {
        const c = {
          id: crypto.randomUUID(),
          title: "",
          createdAt: Date.now(),
          messages: [],
          sessionId: null,
        };
        state.conversations.push(c);
        state.activeId = c.id;
        save();
        renderSidebar();
        renderMessages();
        $("input").focus();
      }

      // ---------- messages ----------
      function renderMessages() {
        const root = $("messages");
        root.innerHTML = "";
        const conv = activeConv();
        if (!conv || conv.messages.length === 0) {
          const ph = document.createElement("div");
          ph.className = "msg";
          ph.style.color = "var(--muted)";
          ph.style.textAlign = "center";
          ph.style.marginTop = "40px";
          ph.textContent = conv
            ? "输入消息开始测试"
            : "点击左侧「新对话」开始。确保 byclaw-super 已在运行并填入 Beyond-Token。";
          root.appendChild(ph);
          return;
        }
        for (const m of conv.messages) {
          const wrap = document.createElement("div");
          wrap.className = "msg " + m.role;

          const who = document.createElement("div");
          who.className = "who";
          who.textContent = m.role === "user" ? "你" : "助手";
          wrap.appendChild(who);

          if (m.role === "assistant") {
            const reasoning = document.createElement("div");
            reasoning.className = "reasoning";
            reasoning.textContent = m.reasoning || "";
            wrap.appendChild(reasoning);
          }

          const body = document.createElement("div");
          body.className = m.role === "user" ? "bubble" : "answer";
          if (m.role === "assistant" && m.streaming) body.classList.add("cursor");
          body.textContent = m.content || "";
          wrap.appendChild(body);

          if (m.role === "assistant" && (m.status || m.streaming)) {
            const st = document.createElement("div");
            st.className = "status" + (m.status === "error" ? " err" : "");
            st.textContent = m.status === "error" ? "失败：" + (m.error || "") : m.status || "";
            wrap.appendChild(st);
          }
          root.appendChild(wrap);
        }
        root.scrollTop = root.scrollHeight;
      }

      // patch only the last assistant message without full re-render (cheap enough either way)
      function refreshLastAssistant() {
        renderMessages();
      }

      // 当前正在流式输出的 Run：{ controller, runId, assistant }，停止按钮用它来中断读取 + 通知服务端。
      let active = null;

      // ---------- sending ----------
      async function send() {
        const input = $("input");
        const text = input.value.trim();
        if (!text) return;
        if (!state.token) {
          alert("请先在顶部填入 Beyond-Token");
          return;
        }
        let conv = activeConv();
        if (!conv) {
          newConversation();
          conv = activeConv();
        }
        conv.messages.push({ role: "user", content: text });
        const assistant = {
          role: "assistant",
          content: "",
          reasoning: "",
          runId: null,
          status: "排队中…",
          streaming: true,
        };
        conv.messages.push(assistant);
        if (!conv.title) conv.title = text.slice(0, 24);
        input.value = "";
        autoGrow();
        setSending(true);
        renderSidebar();
        renderMessages();

        const controller = new AbortController();
        active = { controller, runId: null, assistant };
        let data;
        try {
          const body = { message: text };
          const endpoint = conv.sessionId
            ? `/v1/sessions/${encodeURIComponent(conv.sessionId)}/runs`
            : "/v1/sessions";
          const resp = await fetch(`${baseUrl()}${endpoint}`, {
            method: "POST",
            headers: { "content-type": "application/json", "Beyond-Token": state.token },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          if (!resp.ok) {
            const detail = await resp.text().catch(() => "");
            throw new Error(`创建 Run 失败 (${resp.status}) ${detail}`);
          }
          data = await resp.json();
          assistant.runId = data.runId;
          active.runId = data.runId;
          // 首轮返回的 sessionId 锁定到当前对话，后续轮次复用同一个 Pi 上下文。
          if (data.sessionId) conv.sessionId = data.sessionId;
          assistant.status = "运行中…";
          // 持久化 runId/sessionId：页面刷新后可据此恢复这条进行中的 Run。
          save();
          refreshLastAssistant();
        } catch (err) {
          assistant.streaming = false;
          assistant.status = "error";
          assistant.error = err && err.message ? err.message : String(err);
          if (active && active.assistant === assistant) active = null;
          refreshLastAssistant();
          save();
          setSending(false);
          return;
        }
        await streamToCompletion(assistant, `${baseUrl()}${data.eventsUrl}`, controller);
      }

      // 订阅 SSE 直到终态，统一处理中断/错误/收尾（发送与刷新恢复共用）。
      async function streamToCompletion(assistant, eventsUrl, controller) {
        try {
          await streamEvents(eventsUrl, assistant, controller.signal);
        } catch (err) {
          if (err && err.name === "AbortError") {
            assistant.status = assistant.cancelledByUser ? "已停止" : "已中断";
          } else {
            assistant.status = "error";
            assistant.error = err && err.message ? err.message : String(err);
          }
        } finally {
          assistant.streaming = false;
          if (!TERMINAL_UI_STATUSES.has(assistant.status)) {
            assistant.status = "已完成";
          }
          if (active && active.assistant === assistant) active = null;
          refreshLastAssistant();
          save();
          setSending(false);
        }
      }

      // 刷新恢复：用 GET /v1/runs/:runId 查状态——终态直接回填，非终态从头重放 SSE，404 标记失效。
      async function resumeRun(assistant) {
        if (!assistant.runId) return;
        let resp;
        try {
          resp = await fetch(`${baseUrl()}/v1/runs/${assistant.runId}`, {
            headers: { "Beyond-Token": state.token },
          });
        } catch (err) {
          assistant.streaming = false;
          assistant.status = "恢复失败";
          assistant.error = err && err.message ? err.message : String(err);
          refreshLastAssistant();
          save();
          return;
        }
        if (resp.status === 404) {
          assistant.streaming = false;
          assistant.status = "已失效";
          refreshLastAssistant();
          save();
          return;
        }
        if (!resp.ok) {
          assistant.streaming = false;
          assistant.status = "error";
          assistant.error = `恢复失败 (${resp.status})`;
          refreshLastAssistant();
          save();
          return;
        }
        const run = await resp.json().catch(() => ({}));
        if (TERMINAL_RUN_API_STATUSES.includes(run.status)) {
          assistant.streaming = false;
          assistant.status =
            run.status === "COMPLETED"
              ? "已完成"
              : run.status === "CANCELLED"
                ? "已取消"
                : "失败";
          if (run.finalAnswer) assistant.content = run.finalAnswer;
          if (run.error) assistant.error = run.error;
          refreshLastAssistant();
          save();
          return;
        }
        // 非终态：丢弃残留内容，从 event 0 重放，继续流到终态。
        assistant.content = "";
        assistant.reasoning = "";
        assistant.streaming = true;
        assistant.status = "恢复中…";
        const controller = new AbortController();
        active = { controller, runId: assistant.runId, assistant };
        setSending(true);
        refreshLastAssistant();
        await streamToCompletion(
          assistant,
          `${baseUrl()}/v1/runs/${assistant.runId}/events`,
          controller,
        );
      }

      // fetch-based SSE reader (EventSource can't send custom headers)
      async function streamEvents(eventsUrl, assistant, signal) {
        const resp = await fetch(eventsUrl, {
          method: "GET",
          headers: { "Beyond-Token": state.token, Accept: "text/event-stream" },
          signal,
        });
        if (!resp.ok || !resp.body) {
          throw new Error(`订阅事件失败 (${resp.status})`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            handleFrame(frame, assistant);
          }
        }
      }

      function handleFrame(raw, assistant) {
        const evt = parseFrame(raw);
        if (!evt) return; // heartbeat / comment / empty
        const data = evt.data || {};
        const choiceText = () =>
          data && data.choices && data.choices[0] && data.choices[0].delta
            ? data.choices[0].delta.content || ""
            : "";
        let mutated = false;
        switch (evt.event) {
          case "reasoningLogStart":
          case "reasoningLogEnd":
            break;
          case "reasoningLogDelta":
            assistant.reasoning += choiceText();
            mutated = true;
            break;
          case "answerStart":
          case "answerEnd":
            break;
          case "answerDelta":
            assistant.content += choiceText();
            assistant.status = "回答中…";
            mutated = true;
            break;
          case "appStreamResponse":
            assistant.status = "已完成";
            mutated = true;
            break;
          case "error":
            assistant.status = "error";
            assistant.error = data.message || evt.event;
            mutated = true;
            break;
          default:
            break;
        }
        if (mutated) refreshLastAssistant();
      }

      // id: N\nevent: name\ndata: {...}
      function parseFrame(raw) {
        let id = null;
        let event = null;
        const dataLines = [];
        for (const line of raw.split("\n")) {
          if (!line || line.startsWith(":")) continue;
          if (line.startsWith("id:")) id = line.slice(3).trim();
          else if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
        }
        if (!event && !id) return null;
        let data = {};
        if (dataLines.length) {
          try {
            data = JSON.parse(dataLines.join("\n"));
          } catch {
            data = { raw: dataLines.join("\n") };
          }
        }
        return { id, event, data };
      }

      // ---------- composer helpers ----------
      function setSending(on) {
        $("sendBtn").disabled = on;
        $("stopBtn").disabled = !on;
      }

      // 停止当前 Run：先中断客户端读取，再调用服务端 cancel 触发级联取消。
      async function stopRun() {
        const current = active;
        if (!current) {
          return;
        }
        current.assistant.cancelledByUser = true;
        current.assistant.status = "已停止";
        current.assistant.streaming = false;
        active = null;
        setSending(false);
        refreshLastAssistant();
        save();
        try {
          current.controller.abort();
        } catch {
          /* already aborted */
        }
        if (current.runId) {
          try {
            await fetch(`${baseUrl()}/v1/runs/${current.runId}/cancel`, {
              method: "POST",
              headers: { "Beyond-Token": state.token },
            });
          } catch {
            /* 网络异常忽略，UI 已停止 */
          }
        }
      }
      function autoGrow() {
        const el = $("input");
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 160) + "px";
      }

      // 页面加载恢复：活动对话里残留的进行中 Run 尝试续上，其它对话去掉悬挂光标。
      function resumeOnBoot() {
        let changed = false;
        for (const c of state.conversations) {
          const last = c.messages[c.messages.length - 1];
          if (!last || last.role !== "assistant" || !last.streaming) continue;
          const isActive = c.id === state.activeId;
          if (isActive && last.runId && state.token) continue; // 交给下面的 resumeRun
          last.streaming = false;
          last.status = isActive ? "填入 Token 后刷新可恢复" : "已中断";
          changed = true;
        }
        if (changed) {
          renderMessages();
          save();
        }
        const conv = activeConv();
        const last =
          conv && conv.messages.length ? conv.messages[conv.messages.length - 1] : null;
        if (last && last.role === "assistant" && last.streaming && last.runId && state.token) {
          resumeRun(last);
        }
      }

      // ---------- boot ----------
      function boot() {
        load();
        bindHeader();
        $("newBtn").addEventListener("click", newConversation);
        $("sendBtn").addEventListener("click", send);
        $("stopBtn").addEventListener("click", stopRun);
        const input = $("input");
        input.addEventListener("input", autoGrow);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
        renderSidebar();
        renderMessages();
        resumeOnBoot();
      }
      boot();
    </script>
  </body>
</html>
